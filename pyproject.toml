[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestfit-examples"
version = "0.2.0"
description = "Source-backed RMC-BestFit Python teaching examples"
requires-python = ">=3.10"
dependencies = ["pythonnet>=3.0.5,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "scipy>=1.13,<2"]

[project.optional-dependencies]
notebooks = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bestfit_examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
