# BestFit Batch Workflow Configuration Schema
# This YAML file configures a comprehensive batch processing workflow for flood frequency analysis
# across multiple sites with advanced features including time series forecasting, rating curves, 
# and regional analysis. All paths are relative to the notebooks directory.
#
# Schema Notes:
# - metadata: Workflow identification and version information
# - data: Input data source and site configuration
# - analysis: Analysis modules to enable and their parameters (distribution_fitting, model_comparison,
#            time_series, rating_curves, regional_analysis)
# - output: Output directory, format options, and report generation
# - validation: Data quality checks (minimum record length, outlier detection, coefficient of variation)
#
metadata:
  version: 1.0
  description: "Production batch run - Quarterly update for regional study"
  created: "2024-01-15"

data:
  source_type: "csv"  # Options: csv, database, api
  directory: "../data/inflow"
  file_pattern: "{site}_annual_peaks.csv"
  sites:
    - "A101"
    - "A102"
    - "A103"
    - "A104"
    - "A105"
  n_years: 40
  seed: 42

analysis:
  distribution_fitting:
    enabled: true
  
  model_comparison:
    enabled: true
    method: "aic"
  
  time_series:
    enabled: true  # Set to true to add ARIMA forecasting
    models: ["AR", "ARIMA"]
  
  rating_curves:
    enabled: true
    segments: 2
  
  regional_analysis:
    enabled: true
  
  return_periods: [10, 25, 50, 100, 500]

output:
  base_directory: "../notebooks/outputs/batch_2"
  formats: ["csv", "json", "html"]
  create_report: true

validation:
  min_record_length: 20
  outlier_method: "iqr"  # iqr or zscore
  max_coefficient_variation: 0.75